name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "43 4 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  scan:
    permissions:
      contents: read
      security-events: write
    uses: cletqui/security-workflows/.github/workflows/scan.yml@701f9ed885a1acaabee122d12cfb1156670ad647 # v1.1.0
    with:
      product: ticdot
      semgrep_configs: p/c p/owasp-top-ten
    secrets:
      DOJO_TOKEN: ${{ secrets.DOJO_TOKEN }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
